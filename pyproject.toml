[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tsla-infotainment-lab"
version = "0.4.0"
description = "A desktop workbench for local infotainment compatibility research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6==6.9.3"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pyinstaller==6.16.0"]

[project.gui-scripts]
infotainment-lab = "infotainment_lab.application:main"

[tool.setuptools.package-data]
infotainment_lab = ["runtime/*", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
